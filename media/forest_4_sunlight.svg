<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Sunlight: how fast each screen draws numbers" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Sunlight: how fast each screen draws numbers</title><defs><marker id="ar8ea3b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8ea3b2"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">Sunlight: how fast each screen draws numbers</text><text x="24" y="60" font-size="14" fill="#8ea3b2">Count the numbers drawn against the clock and each screen is a straight line. Its slope is that screen&#x27;s sunlight.</text><rect x="24.0" y="94.0" width="606.0" height="464.0" rx="10" fill="#16232f" stroke="none" stroke-width="0" opacity="0.55" /><line x1="78.0" y1="500.0" x2="600.0" y2="500.0" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="504.0" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">0</text><line x1="78.0" y1="430.9" x2="600.0" y2="430.9" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="434.9" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">2,000</text><line x1="78.0" y1="361.8" x2="600.0" y2="361.8" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="365.8" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">4,000</text><line x1="78.0" y1="292.7" x2="600.0" y2="292.7" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="296.7" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">6,000</text><line x1="78.0" y1="223.6" x2="600.0" y2="223.6" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="227.6" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">8,000</text><line x1="78.0" y1="154.5" x2="600.0" y2="154.5" stroke="#22313f" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="158.5" font-size="11" fill="#5d7080" text-anchor="end" font-weight="normal">10,000</text><text x="32.0" y="112.0" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">numbers drawn since power-on</text><line x1="78.0" y1="120.0" x2="78.0" y2="506.0" stroke="#22313f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="146.6" y="520.0" font-size="12" fill="#8ea3b2" text-anchor="middle" font-weight="normal">house</text><line x1="215.2" y1="120.0" x2="215.2" y2="506.0" stroke="#22313f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="273.5" y="520.0" font-size="12" fill="#8ea3b2" text-anchor="middle" font-weight="normal">farm</text><line x1="331.8" y1="120.0" x2="331.8" y2="506.0" stroke="#22313f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="371.1" y="520.0" font-size="12" fill="#8ea3b2" text-anchor="middle" font-weight="normal">crossroads</text><line x1="410.5" y1="120.0" x2="410.5" y2="506.0" stroke="#22313f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="448.8" y="520.0" font-size="12" fill="#8ea3b2" text-anchor="middle" font-weight="normal">ranch</text><line x1="487.1" y1="120.0" x2="487.1" y2="506.0" stroke="#22313f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="543.5" y="520.0" font-size="12" fill="#8ea3b2" text-anchor="middle" font-weight="normal">beach</text><line x1="600.0" y1="120.0" x2="600.0" y2="506.0" stroke="#e7c14a" stroke-width="1.4" stroke-linecap="round"/><text x="600.0" y="112.0" font-size="12" fill="#e7c14a" text-anchor="middle" font-weight="bold">READY</text><line x1="78.0" y1="500.0" x2="78.0" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="78.0" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">0 s</text><line x1="177.6" y1="500.0" x2="177.6" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="177.6" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">5 s</text><line x1="277.3" y1="500.0" x2="277.3" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="277.3" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">10 s</text><line x1="376.9" y1="500.0" x2="376.9" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="376.9" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">15 s</text><line x1="476.6" y1="500.0" x2="476.6" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="476.6" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">20 s</text><line x1="576.2" y1="500.0" x2="576.2" y2="504.0" stroke="#5d7080" stroke-width="1" stroke-linecap="round"/><text x="576.2" y="538.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">25 s</text><text x="339.0" y="554.0" font-size="11.5" fill="#5d7080" text-anchor="middle" font-weight="normal">time since the house loaded (the same walk on every file)</text><path d="M78.0,482.8 L215.2,475.7 L331.8,394.6 L410.5,318.4 L487.1,243.4 L558.0,175.9 L600.0,134.1" stroke="#6fa8dc" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="482.8" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="215.2" cy="475.7" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="331.8" cy="394.6" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="410.5" cy="318.4" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="487.1" cy="243.4" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="558.0" cy="175.9" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><circle cx="600.0" cy="134.1" r="2.6" fill="#6fa8dc" stroke="none" stroke-width="0"/><path d="M78.0,482.8 L215.2,475.7 L331.8,471.1 L410.5,467.0 L487.1,462.9 L558.0,459.2 L600.0,456.5" stroke="#ffd76a" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="482.8" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="215.2" cy="475.7" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="331.8" cy="471.1" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="410.5" cy="467.0" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="487.1" cy="462.9" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="558.0" cy="459.2" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><circle cx="600.0" cy="456.5" r="2.6" fill="#ffd76a" stroke="none" stroke-width="0"/><text x="263.5" y="427.2" font-size="11.5" fill="#6fa8dc" text-anchor="end" font-weight="normal">401 a second</text><text x="361.1" y="348.5" font-size="11.5" fill="#6fa8dc" text-anchor="end" font-weight="normal">559 a second</text><text x="438.8" y="272.9" font-size="11.5" fill="#6fa8dc" text-anchor="end" font-weight="normal">565 a second</text><text x="533.5" y="180.7" font-size="11.5" fill="#6fa8dc" text-anchor="end" font-weight="normal">558 a second</text><text x="592.0" y="124.1" font-size="12.5" fill="#6fa8dc" text-anchor="end" font-weight="bold">rainy: draw 10,593 at READY</text><text x="592.0" y="444.5" font-size="12.5" fill="#ffd76a" text-anchor="end" font-weight="bold">sunny: draw 1,259 at READY (1,269 with the horse)</text><text x="221.2" y="495.7" font-size="11.5" fill="#ffd76a" text-anchor="start" font-weight="normal">about one per game frame on every screen: the game&#x27;s own clock</text><text x="86.0" y="351.5" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">indoors it never rains:</text><text x="86.0" y="366.5" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">in the house both</text><text x="86.0" y="381.5" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">lines are one</text><rect x="652.0" y="94.0" width="284.0" height="464.0" rx="10" fill="#16232f" stroke="#7fd6ff" stroke-width="1.2" /><text x="668.0" y="118.0" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="bold">Same ground: the pier</text><text x="668.0" y="140.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">From the dog waking until you cast the</text><text x="668.0" y="156.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">slope is steady: 1 a game frame, plus</text><text x="668.0" y="172.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">the dog&#x27;s own draws.</text><line x1="682.0" y1="392.0" x2="906.0" y2="222.0" stroke="#7fd6ff" stroke-width="3" stroke-linecap="round"/><circle cx="749.2" cy="341.0" r="6.0" fill="#5fd38d" stroke="none" stroke-width="0"/><text x="761.2" y="357.0" font-size="12.5" fill="#5fd38d" text-anchor="start" font-weight="bold">A stops</text><text x="761.2" y="372.0" font-size="11" fill="#8ea3b2" text-anchor="start" font-weight="normal">draw 1,253</text><circle cx="834.3" cy="276.4" r="6.0" fill="#e7c14a" stroke="none" stroke-width="0"/><text x="846.3" y="292.4" font-size="12.5" fill="#e7c14a" text-anchor="start" font-weight="bold">B stops</text><text x="846.3" y="307.4" font-size="11" fill="#8ea3b2" text-anchor="start" font-weight="normal">draw 1,271</text><line x1="749.2" y1="418.0" x2="834.3" y2="418.0" stroke="#8ea3b2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar8ea3b2)"/><text x="791.8" y="436.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">14 game frames</text><text x="906.0" y="214.0" font-size="13" fill="#7fd6ff" text-anchor="end" font-weight="bold">L1</text><text x="668.0" y="462.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">Two real plays of one dog line. Both stand</text><text x="668.0" y="478.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">on the same line, so the only difference</text><text x="668.0" y="494.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">left is time. That is why plays can be</text><text x="668.0" y="510.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">joined into one dog line, and why one</text><text x="668.0" y="526.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">tuner setting lines the app up with you.</text><text x="24" y="586" font-size="11.5" fill="#5d7080">Lab: the reference route recorded twice from power-on on each game file (equal both times). Slopes are each screen&#x27;s average between two map loads.</text></svg>
