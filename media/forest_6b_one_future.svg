<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One future: when the sunlight stops changing" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>One future: when the sunlight stops changing</title><defs><pattern id="hatchsun" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#ffd76a" stroke-width="3" opacity="0.55"/></pattern><marker id="ar7fd6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7fd6ff"/></marker></defs><rect x="0" y="0" width="960" height="560" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">One future: when the sunlight stops changing</text><text x="24" y="60" font-size="14" fill="#8ea3b2">From the moment the dog wakes until you cast, nothing you do touches the numbers. Then (x, y) decides everything.</text><rect x="40.0" y="92.0" width="145.0" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.8123779296875" /><text x="113.5" y="138.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">house</text><rect x="187.0" y="92.0" width="122.8" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.6702117919921875" /><text x="249.4" y="138.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">farm</text><rect x="311.8" y="92.0" width="82.2" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.6696624755859375" /><text x="353.9" y="138.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">crossroads</text><rect x="396.0" y="92.0" width="80.0" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.7055511474609375" /><text x="437.0" y="138.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">ranch</text><rect x="478.0" y="92.0" width="74.0" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.837249755859375" /><text x="516.0" y="138.0" font-size="11.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">beach</text><rect x="554.0" y="92.0" width="259.0" height="30.0" rx="3" fill="#ffd76a" stroke="none" stroke-width="0" opacity="0.55" /><rect x="815.0" y="92.0" width="105.0" height="30.0" rx="3" fill="url(#hatchsun)" stroke="none" stroke-width="0" opacity="0.9" /><text x="297.0" y="84.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="normal">sunlight set by you: when each screen loads, when the dog wakes</text><text x="683.5" y="84.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="normal">steady: 1 draw a frame + the dog&#x27;s own</text><text x="866.5" y="84.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="normal">fishing</text><line x1="554.0" y1="90.0" x2="554.0" y2="146.0" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round"/><text x="550.0" y="158.0" font-size="11.5" fill="#e6edf3" text-anchor="end" font-weight="bold">the dog wakes</text><line x1="599.0" y1="90.0" x2="599.0" y2="146.0" stroke="#e7c14a" stroke-width="1.6" stroke-linecap="round"/><text x="603.0" y="158.0" font-size="11.5" fill="#e7c14a" text-anchor="start" font-weight="bold">READY</text><line x1="813.0" y1="90.0" x2="813.0" y2="146.0" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round"/><text x="813.0" y="158.0" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="bold">you cast</text><path d="M130.0,500.0 L109.4,468.7 L157.7,414.9 L137.1,376.7 L100.8,350.6 L145.1,321.1 L108.8,282.0 L153.1,252.5 L116.8,226.4 L87.3,207.3 L74.0,197.7" stroke="#7fd6ff" stroke-width="8.32" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M130.0,500.0 L109.4,468.7 L157.7,414.9 L137.1,376.7 L100.8,350.6 L145.1,321.1 L108.8,282.0 L153.1,252.5 L116.8,226.4 L87.3,207.3 L74.0,197.7" stroke="#7fd6ff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="122.6" cy="488.7" r="6.0" fill="#5fd38d" stroke="none" stroke-width="0"/><text x="134.6" y="492.7" font-size="13" fill="#5fd38d" text-anchor="start" font-weight="bold">A stops</text><circle cx="156.9" cy="415.7" r="6.0" fill="#e7c14a" stroke="none" stroke-width="0"/><text x="168.9" y="419.7" font-size="13" fill="#e7c14a" text-anchor="start" font-weight="bold">B stops</text><text x="38.0" y="206.0" font-size="15" fill="#7fd6ff" text-anchor="middle" font-weight="bold">L1</text><text x="168.9" y="435.7" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">14 frames later, same branch</text><text x="134.6" y="508.7" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">draw 1,253</text><text x="168.9" y="403.7" font-size="11.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">draw 1,271</text><rect x="330.0" y="196.0" width="600.0" height="152.0" rx="10" fill="#16232f" stroke="#5fd38d" stroke-width="1.2" /><text x="346.0" y="222.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="bold">Where A stops:  x = 569,421,077</text><text x="346.0" y="241.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">(draw 1,253 since power-on)</text><text x="346.0" y="268.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">y = the dog: its action, its facing, and a timer that counts down</text><text x="346.0" y="286.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">(L1 starts: action 0, facing 0, timer 2 → 1 → 0 → 10 → 9 → 8 …)</text><text x="346.0" y="314.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">Next frame: x × 1103515245 + 12345 for the game&#x27;s clock, and again for each draw the dog&#x27;s</text><text x="346.0" y="332.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">state calls for; the dog&#x27;s next state follows from its state and x. Nothing else goes in.</text><rect x="330.0" y="362.0" width="600.0" height="62.0" rx="10" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="346.0" y="386.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">So (x, y) has one future. B walked through A&#x27;s exact (x, y) 14 frames before it stopped:</text><text x="346.0" y="404.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">from there on they are one branch. Every copy of a shape is the same causal future.</text><rect x="330.0" y="436.0" width="600.0" height="48.0" rx="10" fill="#0f1a24" stroke="#7fd6ff" stroke-width="1.2" /><line x1="348.0" y1="460.0" x2="380.0" y2="460.0" stroke="#7fd6ff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar7fd6ff)"/><text x="390.0" y="465.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">Your N64 is on that branch too — maybe a few frames higher or lower. That is the tuner&#x27;s job.</text><text x="24" y="546" font-size="11.5" fill="#5d7080">Sunny, horse, L1: two real plays (A: first step 6 VIs late, early pier cut; B: on time, later cut); their gap drawn 6× larger. Clock: 1 draw per game frame (lab probe).</text></svg>
