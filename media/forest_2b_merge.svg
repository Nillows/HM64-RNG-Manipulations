<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Why branches merge" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Why branches merge</title><rect x="0" y="0" width="960" height="470" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">Why branches merge</text><text x="24" y="60" font-size="14" fill="#8ea3b2">1 + 2 = 3 and 2 + 1 = 3: different ways in, one answer. From then on, one branch.</text><rect x="40.0" y="94.0" width="55.2" height="25.0" rx="6" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="67.6" y="113.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="normal">1 + 2</text><path d="M100.0,107.0 L180.8,181.0 L308.0,245.0" stroke="#9a7652" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><rect x="40.0" y="156.0" width="55.2" height="25.0" rx="6" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="67.6" y="175.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="normal">2 + 1</text><path d="M100.0,169.0 L174.3,212.0 L308.0,245.0" stroke="#9a7652" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><rect x="40.0" y="218.0" width="102.2" height="25.0" rx="6" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="91.1" y="237.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="normal">(4 − 1) × 1</text><path d="M148.0,231.0 L224.3,243.0 L308.0,245.0" stroke="#9a7652" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><rect x="40.0" y="280.0" width="55.2" height="25.0" rx="6" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="67.6" y="299.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="normal">6 ÷ 2</text><path d="M100.0,293.0 L175.1,274.0 L308.0,245.0" stroke="#9a7652" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><rect x="40.0" y="342.0" width="180.6" height="25.0" rx="6" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="130.3" y="361.0" font-size="14" fill="#8ea3b2" text-anchor="middle" font-weight="normal">… any of endless ways</text><path d="M228.0,355.0 L310.6,305.0 L308.0,245.0" stroke="#9a7652" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><circle cx="330.0" cy="244.0" r="22.0" fill="#16232f" stroke="#5fd38d" stroke-width="2"/><text x="330.0" y="252.0" font-size="22" fill="#5fd38d" text-anchor="middle" font-weight="bold">3</text><text x="40.0" y="430.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">Different routes, one game state: no need to keep them apart.</text><path d="M860.0,380.0 L860.0,100.0" stroke="#7fd6ff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="860.0" y="88.0" font-size="15" fill="#7fd6ff" text-anchor="middle" font-weight="bold">L1</text><text x="872.0" y="390.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">L1&#x27;s path</text><text x="872.0" y="404.0" font-size="11.5" fill="#5d7080" text-anchor="start" font-weight="normal">(time ↑)</text><path d="M470.0,412.0 L525.7,398.4 L581.4,360.8 L637.1,355.2 L692.9,317.7 L748.6,312.1 L804.3,274.5 L860.0,260.9" stroke="#e7c14a" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="860.0" cy="260.9" r="5.0" fill="#e7c14a" stroke="none" stroke-width="0"/><text x="470.0" y="432.0" font-size="12.5" fill="#e7c14a" text-anchor="middle" font-weight="normal">menus 0 frames late</text><text x="848.0" y="252.9" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="normal">joins at +14 frames</text><path d="M590.0,412.0 L628.6,393.9 L667.1,351.7 L705.7,341.6 L744.3,299.5 L782.9,289.4 L821.4,247.2 L860.0,229.1" stroke="#ff8fb1" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="860.0" cy="229.1" r="5.0" fill="#ff8fb1" stroke="none" stroke-width="0"/><text x="590.0" y="432.0" font-size="12.5" fill="#ff8fb1" text-anchor="middle" font-weight="normal">menus 3 frames late</text><text x="848.0" y="221.1" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="normal">joins at +19 frames</text><path d="M710.0,412.0 L731.4,381.1 L752.9,326.3 L774.3,303.4 L795.7,248.6 L817.1,225.7 L838.6,170.9 L860.0,140.0" stroke="#5fd38d" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="860.0" cy="140.0" r="5.0" fill="#5fd38d" stroke="none" stroke-width="0"/><text x="710.0" y="432.0" font-size="12.5" fill="#5fd38d" text-anchor="middle" font-weight="normal">menus 5 frames late</text><text x="848.0" y="132.0" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="normal">joins at +33 frames</text><rect x="440.0" y="96.0" width="300.0" height="66.0" rx="8" fill="#16232f" stroke="#22313f" stroke-width="1" /><text x="452.0" y="116.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">Same random number + same dog =</text><text x="452.0" y="133.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">the same branch, entered at different</text><text x="452.0" y="150.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">moments. One line, many timings.</text><text x="24" y="456" font-size="11.5" fill="#5d7080">Real merges (Sunny, horse): plays from three menu timings reaching L1, each at its most common moment on L1&#x27;s path.</text></svg>
