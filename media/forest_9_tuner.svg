<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="The tuner: same branch, different height" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The tuner: same branch, different height</title><defs><marker id="ar8ea3b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8ea3b2"/></marker></defs><rect x="0" y="0" width="960" height="530" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">The tuner: same branch, different height</text><text x="24" y="60" font-size="14" fill="#8ea3b2">Knowing the branch is not enough: your N64 may be a few frames ahead of or behind the tables.</text><text x="24.0" y="92.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">[ and ] move the app&#x27;s branch one game frame. When your dog turns at the same moment as the card, the cast moments that grow leaves line up too.</text><path d="M180.0,470.0 L155.9,436.3 L212.3,382.9 L188.3,344.9 L145.9,319.0 L197.6,289.7 L155.2,250.8 L206.9,221.5 L164.6,195.6 L130.2,176.6 L118.9,169.7" stroke="#7fd6ff" stroke-width="7.68" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M180.0,470.0 L155.9,436.3 L212.3,382.9 L188.3,344.9 L145.9,319.0 L197.6,289.7 L155.2,250.8 L206.9,221.5 L164.6,195.6 L130.2,176.6 L118.9,169.7" stroke="#7fd6ff" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="180.0" y="126.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">the tables (app)</text><circle cx="175.0" cy="451.2" r="3.2" fill="#5fd38d" stroke="none" stroke-width="0"/><circle cx="173.1" cy="448.6" r="3.2" fill="#5fd38d" stroke="none" stroke-width="0"/><circle cx="163.2" cy="434.8" r="3.2" fill="#5fd38d" stroke="none" stroke-width="0"/><circle cx="179.8" cy="418.4" r="3.2" fill="#5fd3