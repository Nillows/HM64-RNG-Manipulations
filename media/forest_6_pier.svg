<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-label="The pier moment: group the branches by shape" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The pier moment: group the branches by shape</title><rect x="0" y="0" width="960" height="490" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">The pier moment: group the branches by shape</text><text x="24" y="60" font-size="14" fill="#8ea3b2">Most branches are copies of another branch, started a few frames later. Keep one of each shape.</text><rect x="40.0" y="108.0" width="560.0" height="40.0" rx="6" fill="#9a7652" stroke="none" stroke-width="0" opacity="0.25" /><text x="52.0" y="134.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold">280,387,008</text><text x="614.0" y="125.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">ways to play the route</text><text x="614.0" y="142.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">menu rhythm × house turn × crossroads turn × beach timing</text><rect x="40.0" y="172.0" width="319.9" height="40.0" rx="6" fill="#9a7652" stroke="none" stroke-width="0" opacity="0.4" /><text x="52.0" y="198.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold">35,200</text><text x="373.9" y="189.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">different plays at the beach</text><text x="373.9" y="206.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">identical game states merge on the way</text><text x="40.0" y="165.0" font-size="11.5" fill="#ff8fb1" text-anchor="start" font-weight="normal">1 in 7,966 kept</text><rect x="40.0" y="236.0" width="242.5" height="40.0" rx="6" fill="#7fd6ff" stroke="none" stroke-width="0" opacity="0.55" /><text x="52.0" y="262.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold">1,952</text><text x="296.5" y="253.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">arrivals at READY</text><text x="296.5" y="270.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">a dog line, reached at one timing</text><text x="40.0" y="229.0" font-size="11.5" fill="#ff8fb1" text-anchor="start" font-weight="normal">−94.5%</text><rect x="40.0" y="300.0" width="175.0" height="40.0" rx="6" fill="#7fd6ff" stroke="none" stroke-width="0" opacity="0.7" /><text x="52.0" y="326.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold">156</text><text x="229.0" y="317.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">dog lines</text><text x="229.0" y="334.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">the same branch a few frames later is one line</text><text x="40.0" y="293.0" font-size="11.5" fill="#ff8fb1" text-anchor="start" font-weight="normal">−92.0%</text><rect x="40.0" y="364.0" width="121.4" height="40.0" rx="6" fill="#5fd38d" stroke="none" stroke-width="0" opacity="0.85" /><text x="52.0" y="390.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="bold">21</text><text x="175.4" y="381.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">shapes to tell apart</text><text x="175.4" y="398.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">sister lines that become the same dog (sparrow mornings: 16)</text><text x="40.0" y="357.0" font-size="11.5" fill="#ff8fb1" text-anchor="start" font-weight="normal">−86.5%</text><text x="40.0" y="438.0" font-size="11.5" fill="#5d7080" text-anchor="start" font-weight="normal">Bars are on a log scale.</text><path d="M760.0,418.0 L755.2,407.9 L766.5,391.7 L761.7,380.3 L753.2,372.5 L763.5,363.7 L755.0,352.0 L765.4,343.1 L756.9,335.3 L750.0,329.6 L754.3,325.7 L749.5,317.1 L757.1,304.4 L753.5,298.7 L762.1,282.0 L760.3,279.2 L765.2,271.4 L761.6,265.6 L750.4,252.6 L748.6,249.8 L755.3,2