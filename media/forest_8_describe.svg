<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Describing your dog = describing the shape of your branch" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Describing your dog = describing the shape of your branch</title><defs><marker id="ar8ea3b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8ea3b2"/></marker></defs><rect x="0" y="0" width="960" height="470" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">Describing your dog = describing the shape of your branch</text><text x="24" y="60" font-size="14" fill="#8ea3b2">What the dog does in its first seconds is the shape of its line. A few moves rule out almost everything.</text><rect x="50.0" y="92.0" width="196.0" height="300.0" rx="10" fill="#16232f" stroke="#22313f" stroke-width="1.2" /><text x="148.0" y="118.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">after 1 move</text><text x="148.0" y="158.0" font-size="34" fill="#7fd6ff" text-anchor="middle" font-weight="bold">6</text><text x="148.0" y="180.0" font-size="13" fill="#8ea3b2" text-anchor="middle" font-weight="normal">lines still fit</text><text x="148.0" y="202.0" font-size="12.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">38% of plays look like this</text><path d="M148.0,368.0 L136.3,225.3" stroke="#7fd6ff" stroke-width="8.32" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M148.0,368.0 L136.3,225.3" stroke="#7fd6ff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="148.0" y="384.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">first 1.4 s</text><line x1="249.0" y1="242.0" x2="265.0" y2="242.0" stroke="#8ea3b2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar8ea3b2)"/><rect x="268.0" y="92.0" width="196.0" height="300.0" rx="10" fill="#16232f" stroke="#22313f" stroke-width="1.2" /><text x="366.0" y="118.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">after 2 moves</text><text x="366.0" y="158.0" font-size="34" fill="#7fd6ff" text-anchor="middle" font-weight="bold">2</text><text x="366.0" y="180.0" font-size="13" fill="#8ea3b2" text-anchor="middle" font-weight="normal">lines still fit</text><text x="366.0" y="202.0" font-size="12.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">20% of plays look like this</text><path d="M366.0,368.0 L354.3,311.2 L381.7,220.9" stroke="#7fd6ff" stroke-width="8.32" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M366.0,368.0 L354.3,311.2 L381.7,220.9" stroke="#7fd6ff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="366.0" y="384.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">first 3.4 s</text><line x1="467.0" y1="242.0" x2="483.0" y2="242.0" stroke="#8ea3b2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar8ea3b2)"/><rect x="486.0" y="92.0" width="196.0" height="300.0" rx="10" fill="#16232f" stroke="#22313f" stroke-width="1.2" /><text x="584.0" y="118.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">after 3 moves</text><text x="584.0" y="158.0" font-size="34" fill="#7fd6ff" text-anchor="middle" font-weight="bold">2</text><text x="584.0" y="180.0" font-size="13" fill="#8ea3b2" text-anchor="middle" font-weight="normal">lines still fit</text><text x="584.0" y="202.0" font-size="12.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">20% of plays look like this</text><path d="M584.0,368.0 L572.3,328.2 L599.7,264.9 L588.0,220.0" stroke="#7fd6ff" stroke-width="8.32" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M584.0,368.0 L572.3,328.2 L599.7,264.9 L588.0,220.0" stroke="#7fd6ff" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="584.0" y="384.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">first 4.9 s</text><line x1="685.0" y1="242.0" x2="701.0" y2="242.0" stroke="#8ea3b2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar8ea3b2)"/><rect x="704.0" y="92.0" width="196.0" height="300.0" rx="10" fill="#16232f" stroke="#5fd38d" stroke-width="1.2" /><text x="802.0" y="118.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">after 4 moves</text><text x="802.0" y="158.0" font-size="34" fill="#5fd38d" text-anchor="middle" font-weight="bold">1</text><text x="802.0" y="180.0" font-size="13" fill="#8ea3b2" text-anchor="middle" font-weight="normal">line fits: L1</text><text x="802.0" y="202.0" font-size="12.5" fill="#8ea3b2" text-anchor="middle" font-weight="normal">14% of plays look like this</text><path d="M802.0,368.0 L790.3,334.9 L817.7,282.4 L806.0,245.1 L785.4,219.7" stroke="#5fd38d" stroke-width="8.32" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.13"/><path d="M802.0,368.0 L790.3,334.9 L817.7,282.4 L806.0,245.1 L785.4,219.7" stroke="#5fd38d" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="802.0" y="384.0" font-size="11" fill="#5d7080" text-anchor="middle" font-weight="normal">first 5.9 s</text><text x="50.0" y="420.0" font-size="12.5" fill="#8ea3b2" text-anchor="start" font-weight="normal">The tool weighs each line by how well it fits your keys and keeps the rest in play, so one wrong key does not lose your dog.</text><text x="24" y="456" font-size="11.5" fill="#5d7080">Sunny → No horse, 84 dog lines. A shape = the order of what the dog does (facing and animation), timing ignored. Share = route weight.</text></svg>
