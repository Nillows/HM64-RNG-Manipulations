<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="The leaves: only a cast grows them" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>The leaves: only a cast grows them</title><rect x="0" y="0" width="960" height="660" rx="14" fill="#0f1a24"/><text x="24" y="36" font-size="21" font-weight="700" fill="#e6edf3">The leaves: only a cast grows them</text><text x="24" y="60" font-size="14" fill="#8ea3b2">Without a cast the branch has no leaves. A cast bends it, and the branch that grows from the bend decides what bites.</text><text x="24.0" y="146.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">No cast</text><text x="24.0" y="164.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">the branch in base sunlight</text><text x="24.0" y="306.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">Cast at 16.23 s</text><text x="24.0" y="324.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">the cast bends it</text><text x="24.0" y="466.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">Cast at 16.26 s</text><text x="24.0" y="484.0" font-size="12" fill="#8ea3b2" text-anchor="start" font-weight="normal">one game frame later</text><path d="M171.2,150.0 L195.6,139.7 L234.4,163.9 L261.9,153.5 L280.6,135.4 L301.9,157.5 L330.0,139.4 L351.2,161.5 L370.0,143.4 L383.8,128.6 L393.1,137.7 L413.8,127.4 L444.4,143.7 L458.1,136.2 L498.1,154.5 L505.0,150.7 L523.8,161.1 L537.5,153.5 L568.8,129.4 L575.6,125.6 L604.4,139.9 L611.2,136.2 L630.0,121.9 L677.5,134.2 L696.2,148.4 L716.2,136.2 L757.5,125.8 L780.0,138.3 L793.8,130.7 L812.5,141.1 L826.2,133.5 L833.1,141.5 L861.2,155.5 L861.9,154.9 L871.2,161.9 L878.1,156.8 L880.0,154.3 L893.8,137.0 L895.6,134.4 L916.2,120.7 L920.0,125.9" stroke="#9a7652" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="920.0" y="1